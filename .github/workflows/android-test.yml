name: Android tests

on:
  push:
    branches: ["**"]
    paths:
      - "app/**"
      - ".github/workflows/android-test.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            gradle connectedDebugAndroidTest --no-daemon --continue || echo "TESTS_FAILED=1" >> "$GITHUB_ENV"
            mkdir -p shots && adb pull /data/local/tmp/shots/. shots/ || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-results
          path: |
            shots/
            app/build/reports/androidTests/
            app/build/reports/tests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn

      - name: Fail if tests failed
        if: env.TESTS_FAILED == '1'
        run: exit 1
